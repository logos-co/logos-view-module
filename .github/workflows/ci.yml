name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    environment: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && 'public-cache' || '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Logos nix cache: reads cache.nix.logos.co (public + ci) and publishes
      # what this job builds; logos-co.cachix.org stays as a read-only fallback.
      - name: Set up Nix and the Logos cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}
          extra-nix-config: |
            extra-substituters = https://logos-co.cachix.org
            extra-trusted-public-keys = logos-co.cachix.org-1:12K8609ho1pCt0erUQrOrs/KmOuhWq/EhVwhzQRb35E=

      - name: View glue generation
        run: nix build '.#checks.x86_64-linux.view-generator'

      - name: Malformed .rep is rejected
        run: nix build '.#checks.x86_64-linux.view-generator-rejects-bad-rep'

      # The templates in cmake/ are the module side of a plugin ABI whose host
      # side lives in logos-view-module-runtime. This builds a factory from
      # them, asserts the exact IID in the binary, then QPluginLoaders it and
      # performs the same qobject_cast ui-host does.
      - name: .rep replica factory builds, loads and casts
        run: nix build '.#checks.x86_64-linux.rep-file-plugin'
